<section class="section reviews-sec" id="reviews">
  <div class="container">
    <div class="reviews-head" appReveal>
      <div>
        <span class="eyebrow">Reviews</span>
        <h2 class="section-title">Loved by Azamgarh</h2>
        <p class="section-sub">Real words from our Google reviews — {{ site.rating }} stars across {{ site.reviewCount }} reviews and counting.</p>
      </div>
      <a class="btn btn-outline btn-sm" [href]="site.mapsSearchUrl" target="_blank" rel="noopener">
        <app-icon name="external-link"></app-icon> All Google reviews
      </a>
    </div>

    <div class="reviews-grid">
      @for (r of reviews; track r.name) {
        <figure class="review card" appReveal>
          <span class="quote"><app-icon name="message-circle"></app-icon></span>
          <span class="stars" aria-label="5 out of 5 stars">★★★★★</span>
          <blockquote>{{ r.text }}</blockquote>
          <figcaption>
            <span class="avatar">{{ r.name.charAt(0) }}</span>
            <span><strong>{{ r.name }}</strong><small>{{ r.meta }}</small></span>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
